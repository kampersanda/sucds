name: Claude on demand

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # issue_comment also fires for issues, so only accept PR comments for that event.
    if: >-
      github.event_name == 'pull_request_review_comment' ||
      github.event.issue.pull_request
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 12
            --append-system-prompt "コード変更は行わず、レビュー・説明・提案のみをしてください。"
